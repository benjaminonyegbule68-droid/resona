<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090811">
<title>Resona</title>

<style>
:root {
  --bg: #090811;
  --panel: #151321;
  --panel-light: #201c30;
  --border: rgba(255,255,255,.09);
  --text: #f6f3ff;
  --muted: #9993ad;
  --purple: #9b70ff;
  --teal: #48d8c1;
  --danger: #ff6b7a;
}

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
    "Segoe UI", sans-serif;
}

button {
  font: inherit;
}

#resona-shell {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  position: relative;
  background:
    radial-gradient(circle at 15% 0%, rgba(155,112,255,.10), transparent 35%),
    var(--bg);
}

#pageFrame {
  width: 100%;
  flex: 1;
  min-height: 0;
  border: 0;
  background: var(--bg);
}

/* Persistent player */

#shell-player {
  position: relative;
  z-index: 20;
  flex-shrink: 0;
  width: 100%;
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
  background: rgba(18,16,29,.97);
  border-top: 1px solid var(--border);
  backdrop-filter: blur(20px);
}

.player-main {
  display: flex;
  align-items: center;
  gap: 12px;
  max-width: 1200px;
  margin: 0 auto;
}

.artwork {
  width: 48px;
  height: 48px;
  flex-shrink: 0;
  border-radius: 9px;
  overflow: hidden;
  background: var(--panel-light);
  display: grid;
  place-items: center;
}

.artwork img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.track-information {
  min-width: 0;
  flex: 1;
}

.track-title {
  font-size: 13px;
  font-weight: 700;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.track-artist {
  margin-top: 4px;
  font-size: 11px;
  color: var(--muted);
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.player-controls {
  display: flex;
  align-items: center;
  gap: 8px;
}

.control-button {
  width: 36px;
  height: 36px;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: 50%;
  background: transparent;
  color: var(--text);
  cursor: pointer;
  font-size: 17px;
}

.control-button:hover {
  background: rgba(255,255,255,.09);
}

.control-button.active {
  color: var(--teal);
}

#shellPlayButton {
  width: 42px;
  height: 42px;
  background: var(--text);
  color: #171321;
  font-size: 19px;
}

#shellPlayButton:hover {
  background: var(--teal);
}

.progress-row {
  max-width: 1200px;
  margin: 9px auto 0;
  display: flex;
  align-items: center;
  gap: 9px;
}

.time-label {
  min-width: 33px;
  font-size: 10px;
  color: var(--muted);
  text-align: center;
  font-variant-numeric: tabular-nums;
}

#miniProgress {
  width: 100%;
  height: 4px;
  appearance: none;
  border: 0;
  border-radius: 20px;
  outline: none;
  background: rgba(255,255,255,.15);
  cursor: pointer;
}

#miniProgress::-webkit-slider-thumb {
  appearance: none;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--teal);
}

#miniProgress::-moz-range-thumb {
  width: 10px;
  height: 10px;
  border: 0;
  border-radius: 50%;
  background: var(--teal);
}

.extra-controls {
  display: flex;
  align-items: center;
  gap: 3px;
}

.extra-controls .control-button {
  width: 31px;
  height: 31px;
  font-size: 14px;
}

#shellMessage {
  position: fixed;
  z-index: 100;
  left: 50%;
  bottom: 105px;
  transform: translateX(-50%) translateY(10px);
  max-width: calc(100% - 32px);
  padding: 11px 16px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: #211d30;
  color: var(--text);
  font-size: 12px;
  opacity: 0;
  pointer-events: none;
  transition: .2s ease;
  text-align: center;
}

#shellMessage.visible {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

#shellLoading {
  position: absolute;
  inset: 0;
  z-index: 10;
  display: grid;
  place-items: center;
  background: var(--bg);
  transition: opacity .3s ease;
  pointer-events: none;
}

#shellLoading.hidden {
  opacity: 0;
  visibility: hidden;
}

.loading-content {
  text-align: center;
}

.loading-logo {
  font-size: 32px;
  font-weight: 800;
  letter-spacing: -2px;
  background: linear-gradient(120deg, var(--purple), var(--teal));
  color: transparent;
  background-clip: text;
  -webkit-background-clip: text;
}

.loading-text {
  margin-top: 10px;
  font-size: 12px;
  color: var(--muted);
}

.loading-spinner {
  width: 22px;
  height: 22px;
  margin: 20px auto 0;
  border: 2px solid rgba(255,255,255,.12);
  border-top-color: var(--teal);
  border-radius: 50%;
  animation: spin .8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

@media (max-width: 520px) {
  #shell-player {
    padding-left: 11px;
    padding-right: 11px;
  }

  .player-main {
    gap: 9px;
  }

  .artwork {
    width: 43px;
    height: 43px;
  }

  .player-controls {
    gap: 2px;
  }

  .control-button {
    width: 32px;
    height: 32px;
  }

  #shellPlayButton {
    width: 39px;
    height: 39px;
  }

  .extra-controls {
    display: none;
  }
}
</style>
</head>

<body>

<div id="resona-shell">

  <iframe
    id="pageFrame"
    src="./index.html"
    title="Resona Music"
    allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
    referrerpolicy="same-origin">
  </iframe>

  <div id="shellLoading">
    <div class="loading-content">
      <div class="loading-logo">resona.</div>
      <div class="loading-text">Preparing your music experience</div>
      <div class="loading-spinner"></div>
    </div>
  </div>

  <section id="shell-player" aria-label="Persistent music player">

    <div class="player-main">

      <div class="artwork" id="miniArtwork">
        <span>♫</span>
      </div>

      <div class="track-information">
        <div class="track-title" id="miniTrackTitle">
          Nothing playing
        </div>
        <div class="track-artist" id="miniArtist">
          Choose something to listen to
        </div>
      </div>

      <div class="player-controls">

        <button
          class="control-button"
          id="shellPreviousButton"
          type="button"
          aria-label="Previous track">
          &#9198;
        </button>

        <button
          class="control-button"
          id="shellPlayButton"
          type="button"
          aria-label="Play">
          &#9654;
        </button>

        <button
          class="control-button"
          id="shellNextButton"
          type="button"
          aria-label="Next track">
          &#9197;
        </button>

      </div>

      <div class="extra-controls">

        <button
          class="control-button"
          id="shellShuffleButton"
          type="button"
          aria-label="Shuffle">
          &#8645;
        </button>

        <button
          class="control-button"
          id="shellRepeatButton"
          type="button"
          aria-label="Repeat">
          &#8635;
        </button>

      </div>

    </div>

    <div class="progress-row">
      <span class="time-label" id="shellCurrentTime">0:00</span>

      <input
        type="range"
        id="miniProgress"
        min="0"
        max="100"
        value="0"
        step="0.1"
        aria-label="Playback progress">

      <span class="time-label" id="shellDuration">0:00</span>
    </div>

  </section>

  <div id="shellMessage" role="status" aria-live="polite"></div>

</div>

<audio id="resonaAudio" preload="metadata"></audio>

<script>
(() => {
  "use strict";

  /*
   * Resona persistent player shell.
   *
   * Engine version: 2.1.0
   * Bridge protocol: 1.0.0
   */

  const ENGINE_VERSION = "2.1.0";
  const PROTOCOL_VERSION = "1.0.0";

  const SHELL_SOURCE = "resona-shell";
  const PAGE_SOURCE = "resona-page";

  const frame = document.getElementById("pageFrame");
  const audio = document.getElementById("resonaAudio");

  const elements = {
    artwork: document.getElementById("miniArtwork"),
    title: document.getElementById("miniTrackTitle"),
    artist: document.getElementById("miniArtist"),
    play: document.getElementById("shellPlayButton"),
    previous: document.getElementById("shellPreviousButton"),
    next: document.getElementById("shellNextButton"),
    shuffle: document.getElementById("shellShuffleButton"),
    repeat: document.getElementById("shellRepeatButton"),
    progress: document.getElementById("miniProgress"),
    currentTime: document.getElementById("shellCurrentTime"),
    duration: document.getElementById("shellDuration"),
    message: document.getElementById("shellMessage"),
    loading: document.getElementById("shellLoading")
  };

  const state = {
    ready: false,
    playing: false,
    currentTrack: null,
    queue: [],
    currentIndex: -1,
    shuffle: false,
    repeat: "off",
    currentTime: 0,
    duration: 0,
    volume: 1,
    muted: false
  };

  let messageTimer = null;
  let lastProgressUpdate = 0;

  function createId() {
    return "resona_" +
      Date.now().toString(36) +
      Math.random().toString(36).slice(2, 9);
  }

  function safeString(value) {
    return String(value ?? "").trim();
  }

  function getTrackId(track) {
    if (!track || typeof track !== "object") return "";

    return safeString(
      track.id ||
      track.track_id ||
      track.trackId ||
      track.uuid
    );
  }

  function getAudioUrl(track) {
    if (!track || typeof track !== "object") return "";

    return safeString(
      track.audio_url ||
      track.stream_url ||
      track.file_url ||
      track.audioUrl
    );
  }

  function getArtwork(track) {
    if (!track || typeof track !== "object") return "";

    return safeString(
      track.artwork_url ||
      track.album_artwork_url ||
      track.cover_url ||
      track.cover_art_url ||
      track.image_url ||
      track.image
    );
  }

  function formatTime(seconds) {
    const value = Number(seconds);

    if (!Number.isFinite(value) || value < 0) {
      return "0:00";
    }

    const minutes = Math.floor(value / 60);
    const remaining = Math.floor(value % 60);

    return minutes + ":" + String(remaining).padStart(2, "0");
  }

  function showMessage(message) {
    elements.message.textContent = safeString(message);
    elements.message.classList.add("visible");

    clearTimeout(messageTimer);

    messageTimer = setTimeout(() => {
      elements.message.classList.remove("visible");
    }, 3000);
  }

  function validAudioUrl(url) {
    if (!url) return false;

    try {
      const parsed = new URL(url, location.href);

      return (
        parsed.protocol === "https:" ||
        (
          parsed.protocol === "http:" &&
          parsed.origin === location.origin
        )
      );
    } catch {
      return false;
    }
  }

  function updateDisplay() {
    const track = state.currentTrack;

    if (!track) {
      elements.title.textContent = "Nothing playing";
      elements.artist.textContent = "Choose something to listen to";
      elements.artwork.innerHTML = "<span>♫</span>";
    } else {
      elements.title.textContent =
        safeString(track.title || track.name) || "Untitled track";

      elements.artist.textContent =
        safeString(
          track.artist_name ||
          track.artist ||
          track.artistName
        ) || "Unknown artist";

      const artwork = getArtwork(track);

      if (artwork) {
        elements.artwork.innerHTML = "";

        const image = document.createElement("img");
        image.src = artwork;
        image.alt = "Album artwork";

        image.onerror = () => {
          elements.artwork.innerHTML = "<span>♫</span>";
        };

        elements.artwork.appendChild(image);
      } else {
        elements.artwork.innerHTML = "<span>♫</span>";
      }
    }

    elements.play.innerHTML = state.playing
      ? "&#10074;&#10074;"
      : "&#9654;";

    elements.play.setAttribute(
      "aria-label",
      state.playing ? "Pause" : "Play"
    );

    elements.shuffle.classList.toggle("active", state.shuffle);

    elements.repeat.classList.toggle(
      "active",
      state.repeat !== "off"
    );

    elements.repeat.textContent =
      state.repeat === "one" ? "↻¹" : "↻";
  }

  function updateProgress() {
    const duration = Number(audio.duration) || 0;
    const currentTime = Number(audio.currentTime) || 0;

    state.currentTime = currentTime;
    state.duration = duration;

    elements.progress.max = duration || 100;
    elements.progress.value = Math.min(currentTime, duration || 100);

    elements.currentTime.textContent = formatTime(currentTime);
    elements.duration.textContent = formatTime(duration);
  }

  function getState() {
    return {
      ready: state.ready,

      // The bridge expects "playing".
      playing: state.playing,

      // Keep the old alias for compatibility.
      isPlaying: state.playing,

      currentTrack: state.currentTrack,
      queue: state.queue.slice(),
      currentIndex: state.currentIndex,
      shuffle: state.shuffle,
      repeat: state.repeat,
      currentTime: Number(audio.currentTime) || 0,
      duration: Number(audio.duration) || 0,
      volume: audio.volume,
      muted: audio.muted
    };
  }

  function sendToPage(action, payload = {}, requestId = null) {
    if (!frame.contentWindow) return;

    frame.contentWindow.postMessage({
      source: SHELL_SOURCE,
      version: PROTOCOL_VERSION,
      action,
      requestId,
      payload
    }, location.origin);
  }

  function broadcast(action, payload = {}) {
    sendToPage(action, payload);
  }

  function respond(event, message, payload = {}) {
    event.source.postMessage({
      source: SHELL_SOURCE,
      version: PROTOCOL_VERSION,
      action: message.action + "_RESULT",
      requestId: message.requestId,
      payload
    }, event.origin);
  }

  function broadcastState() {
    broadcast("PLAYER_STATE", getState());
  }

  function updateMediaSession() {
    if (!("mediaSession" in navigator)) return;

    const track = state.currentTrack;

    if (!track) return;

    try {
      const artwork = getArtwork(track);

      navigator.mediaSession.metadata =
        new MediaMetadata({
          title: safeString(track.title || track.name) || "Untitled",
          artist: safeString(
            track.artist_name ||
            track.artist ||
            track.artistName
          ) || "Unknown artist",
          album: safeString(track.album_title || track.album) || "Resona",
          artwork: artwork
            ? [{ src: artwork }]
            : []
        });

      navigator.mediaSession.setActionHandler("play", resume);
      navigator.mediaSession.setActionHandler("pause", pause);
      navigator.mediaSession.setActionHandler("nexttrack", nextTrack);
      navigator.mediaSession.setActionHandler("previoustrack", previousTrack);

      navigator.mediaSession.setActionHandler("seekto", details => {
        if (Number.isFinite(details.seekTime)) {
          seek(details.seekTime);
        }
      });
    } catch (error) {
      console.warn("Media Session update failed:", error);
    }
  }

  async function playTrack(track, index = -1) {
    if (!track || typeof track !== "object") {
      showMessage("This track is not available.");
      return { success: false, error: "Invalid track." };
    }

    const id = getTrackId(track);
    const url = getAudioUrl(track);

    if (!id) {
      showMessage("This track has no valid ID.");
      return { success: false, error: "Missing track ID." };
    }

    if (!validAudioUrl(url)) {
      showMessage("This track has no valid streaming audio URL.");
      return { success: false, error: "Invalid audio URL." };
    }

    state.currentTrack = track;

    if (index >= 0 && index < state.queue.length) {
      state.currentIndex = index;
    } else {
      const foundIndex = state.queue.findIndex(
        item => getTrackId(item) === id
      );

      state.currentIndex = foundIndex;
    }

    audio.pause();
    audio.src = url;
    audio.load();

    updateDisplay();
    updateMediaSession();

    broadcast("TRACK_CHANGED", track);

    try {
      await audio.play();

      state.playing = true;
      updateDisplay();
      broadcast("PLAYBACK_PLAY", getState());
      broadcastState();

      return { success: true };
    } catch (error) {
      state.playing = false;
      updateDisplay();

      const message =
        error && error.name === "NotAllowedError"
          ? "Your browser blocked playback. Tap Play to continue."
          : "Unable to play this track.";

      showMessage(message);

      broadcast("PLAYER_ERROR", {
        message: error?.message || message
      });

      broadcastState();

      return {
        success: false,
        error: error?.message || message
      };
    }
  }

  async function playTrackWithQueue(track, queue) {
    const tracks = Array.isArray(queue) ? queue : [];

    state.queue = tracks.filter(item => getTrackId(item));

    let index = state.queue.findIndex(
      item => getTrackId(item) === getTrackId(track)
    );

    if (index < 0) {
      state.queue.unshift(track);
      index = 0;
    }

    return playTrack(state.queue[index], index);
  }

  async function setQueue(tracks, startTrackId = null) {
    state.queue = Array.isArray(tracks)
      ? tracks.filter(item => getTrackId(item))
      : [];

    let index = 0;

    if (startTrackId) {
      const found = state.queue.findIndex(
        item => getTrackId(item) === String(startTrackId)
      );

      if (found >= 0) index = found;
    }

    if (!state.queue.length) {
      state.currentIndex = -1;
      broadcastState();

      return { success: true };
    }

    return playTrack(state.queue[index], index);
  }

  function addToQueue(track) {
    if (!track || !getTrackId(track)) {
      return { success: false, error: "Invalid track." };
    }

    const exists = state.queue.some(
      item => getTrackId(item) === getTrackId(track)
    );

    if (!exists) {
      state.queue.push(track);
    }

    broadcastState();

    return { success: true };
  }

  function pause() {
    audio.pause();
  }

  async function resume() {
    if (!audio.src) {
      showMessage("Choose a track first.");
      return { success: false };
    }

    try {
      await audio.play();
      return { success: true };
    } catch (error) {
      showMessage("Unable to resume playback.");

      return {
        success: false,
        error: error?.message || "Playback failed."
      };
    }
  }

  async function togglePlayback() {
    if (audio.paused) {
      return resume();
    }

    pause();

    return { success: true };
  }

  function nextTrack() {
    if (!state.queue.length) {
      showMessage("Your queue is empty.");
      return { success: false };
    }

    let nextIndex;

    if (state.shuffle && state.queue.length > 1) {
      do {
        nextIndex = Math.floor(Math.random() * state.queue.length);
      } while (nextIndex === state.currentIndex);
    } else {
      nextIndex = state.currentIndex + 1;
    }

    if (nextIndex >= state.queue.length) {
      if (state.repeat === "all") {
        nextIndex = 0;
      } else {
        state.playing = false;
        updateDisplay();
        broadcastState();

        return { success: false, error: "End of queue." };
      }
    }

    return playTrack(state.queue[nextIndex], nextIndex);
  }

  function previousTrack() {
    if (!state.queue.length) {
      return { success: false };
    }

    if (audio.currentTime > 3) {
      seek(0);
      return { success: true };
    }

    let previousIndex = state.currentIndex - 1;

    if (previousIndex < 0) {
      if (state.repeat === "all") {
        previousIndex = state.queue.length - 1;
      } else {
        previousIndex = 0;
      }
    }

    return playTrack(state.queue[previousIndex], previousIndex);
  }

  function seek(seconds) {
    const value = Number(seconds);

    if (!Number.isFinite(value)) return;

    if (Number.isFinite(audio.duration)) {
      audio.currentTime = Math.max(
        0,
        Math.min(value, audio.duration)
      );
    }
  }

  function setVolume(value) {
    const volume = Number(value);

    if (!Number.isFinite(volume)) return;

    audio.volume = Math.max(0, Math.min(1, volume));
    state.volume = audio.volume;
    state.muted = audio.muted;

    broadcastState();
  }

  function mute() {
    audio.muted = true;
    state.muted = true;
    broadcastState();
  }

  function unmute() {
    audio.muted = false;
    state.muted = false;
    broadcastState();
  }

  function setShuffle(enabled) {
    state.shuffle = Boolean(enabled);
    updateDisplay();
    broadcastState();
  }

  function setRepeat(mode) {
    const allowed = ["off", "all", "one"];

    state.repeat = allowed.includes(mode) ? mode : "off";

    updateDisplay();
    broadcastState();
  }

  function toggleShuffle() {
    setShuffle(!state.shuffle);
  }

  function toggleRepeat() {
    const modes = ["off", "all", "one"];
    const index = modes.indexOf(state.repeat);

    setRepeat(modes[(index + 1) % modes.length]);
  }

  function navigate(url) {
    const allowedPages = [
      "index.html",
      "explore.html",
      "search.html",
      "artist.html",
      "album.html",
      "player.html",
      "lyrics.html",
      "library.html",
      "playlists.html",
      "downloads.html",
      "profile.html",
      "settings.html",
      "login.html",
      "register.html",
      "forgot-password.html",
      "artist-dashboard.html",
      "upload.html"
    ];

    let parsed;

    try {
      parsed = new URL(url, location.href);
    } catch {
      return { success: false, error: "Invalid navigation URL." };
    }

    if (parsed.origin !== location.origin) {
      return { success: false, error: "External navigation blocked." };
    }

    const filename = parsed.pathname.split("/").pop();

    if (!allowedPages.includes(filename)) {
      return { success: false, error: "Page not allowed." };
    }

    frame.src = parsed.href;

    return { success: true };
  }

  function handleCommand(event, message) {
    const payload = message.payload || {};
    let result = { success: true };

    switch (message.action) {

      case "PAGE_READY":
        state.ready = true;
        result = { success: true };
        break;

      case "PLAY_TRACK":
        result = playTrackWithQueue(
          payload.track,
          payload.queue
        );
        break;

      case "SET_QUEUE":
        result = setQueue(
          payload.tracks,
          payload.startTrackId
        );
        break;

      case "ADD_TO_QUEUE":
        result = addToQueue(payload.track);
        break;

      case "PAUSE":
        pause();
        break;

      case "RESUME":
        result = resume();
        break;

      case "TOGGLE_PLAY":
        result = togglePlayback();
        break;

      case "NEXT_TRACK":
        result = nextTrack();
        break;

      case "PREVIOUS_TRACK":
        result = previousTrack();
        break;

      case "SEEK":
        seek(payload.seconds);
        break;

      case "SET_VOLUME":
        setVolume(payload.volume);
        break;

      case "MUTE":
        mute();
        break;

      case "UNMUTE":
        unmute();
        break;

      case "SET_SHUFFLE":
        setShuffle(payload.enabled);
        break;

      case "SET_REPEAT":
        setRepeat(payload.mode);
        break;

      case "GET_PLAYER_STATE":
        result = getState();
        break;

      case "NAVIGATE":
        result = navigate(payload.url);
        break;

      default:
        result = {
          success: false,
          error: "Unsupported command: " + message.action
        };
    }

    Promise.resolve(result)
      .then(response => {
        respond(event, message, response || { success: true });
      })
      .catch(error => {
        respond(event, message, {
          success: false,
          error: error?.message || "Shell command failed."
        });
      });
  }

  window.addEventListener("message", event => {
    if (event.source !== frame.contentWindow) return;
    if (event.origin !== location.origin) return;

    const message = event.data;

    if (!message || message.source !== PAGE_SOURCE) return;

    if (message.version !== PROTOCOL_VERSION) {
      console.warn(
        "Resona bridge protocol mismatch:",
        message.version
      );

      return;
    }

    handleCommand(event, message);
  });

  /* Audio events */

  audio.addEventListener("play", () => {
    state.playing = true;
    updateDisplay();
    broadcast("PLAYBACK_PLAY", getState());
    broadcastState();
  });

  audio.addEventListener("pause", () => {
    state.playing = false;
    updateDisplay();
    broadcast("PLAYBACK_PAUSE", getState());
    broadcastState();
  });

  audio.addEventListener("ended", () => {
    state.playing = false;

    if (state.repeat === "one") {
      audio.currentTime = 0;
      resume();
      return;
    }

    nextTrack();

    broadcast("PLAYBACK_ENDED", getState());
  });

  audio.addEventListener("timeupdate", () => {
    updateProgress();

    const now = Date.now();

    if (now - lastProgressUpdate > 500) {
      lastProgressUpdate = now;

      broadcast("TIME_UPDATE", {
        currentTime: audio.currentTime || 0,
        duration: audio.duration || 0
      });
    }
  });

  audio.addEventListener("loadedmetadata", () => {
    updateProgress();
    broadcastState();
  });

  audio.addEventListener("durationchange", updateProgress);

  audio.addEventListener("volumechange", () => {
    state.volume = audio.volume;
    state.muted = audio.muted;
    broadcastState();
  });

  audio.addEventListener("error", () => {
    state.playing = false;
    updateDisplay();

    const error = audio.error;

    const message = error
      ? "Audio playback error (" + error.code + ")."
      : "Unable to load this audio.";

    showMessage(message);

    broadcast("PLAYER_ERROR", { message });
    broadcastState();
  });

  /* Player controls */

  elements.play.addEventListener("click", togglePlayback);
  elements.previous.addEventListener("click", previousTrack);
  elements.next.addEventListener("click", nextTrack);
  elements.shuffle.addEventListener("click", toggleShuffle);
  elements.repeat.addEventListener("click", toggleRepeat);

  elements.progress.addEventListener("input", () => {
    seek(Number(elements.progress.value));
  });

  /* Public shell API */

  window.ResonaPlayer = {
    version: ENGINE_VERSION,
    protocolVersion: PROTOCOL_VERSION,

    play: playTrack,
    playTrack,
    playTrackWithQueue,
    setQueue,
    addToQueue,

    pause,
    resume,
    toggle: togglePlayback,
    togglePlayback,

    next: nextTrack,
    nextTrack,
    previous: previousTrack,
    previousTrack,

    seek,
    setVolume,
    mute,
    unmute,

    setShuffle,
    setRepeat,
    toggleShuffle,
    toggleRepeat,

    navigate,

    getState,
    refreshState: broadcastState,

    getAudioElement: () => audio
  };

  /* Frame setup */

  frame.addEventListener("load", () => {
    elements.loading.classList.add("hidden");

    /*
     * Hide the iframe's duplicate mini-player.
     * The persistent shell player remains visible.
     * The iframe elements still exist for app.js.
     */
    try {
      const frameDocument = frame.contentDocument;

      if (frameDocument && frameDocument.head) {
        let style = frameDocument.getElementById(
          "resona-shell-player-style"
        );

        if (!style) {
          style = frameDocument.createElement("style");
          style.id = "resona-shell-player-style";

          style.textContent = `
            #mini-player {
              display: none !important;
            }
          `;

          frameDocument.head.appendChild(style);
        }
      }
    } catch (error) {
      console.warn("Could not adjust iframe player display:", error);
    }

    setTimeout(() => {
      sendToPage("SHELL_READY", getState());
      broadcastState();
    }, 150);
  });

  /* Initial setup */

  audio.volume = 1;

  updateDisplay();
  updateProgress();

  state.ready = true;

  console.info(
    "Resona shell engine initialized:",
    ENGINE_VERSION
  );

})();
</script>

</body>
        </html>
