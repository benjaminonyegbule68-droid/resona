<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090811">

<title>Resona | Music Without Borders</title>

<style>
:root {
  --bg: #090811;
  --panel: #151220;
  --panel2: #1d192b;
  --border: rgba(255,255,255,.09);
  --text: #f5f1ff;
  --muted: #a29ab5;
  --purple: #a78bfa;
  --teal: #45dfc2;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
}

button,
input {
  font: inherit;
}

button {
  -webkit-tap-highlight-color: transparent;
}

/* APPLICATION */

#resonaApp {
  width: 100%;
  height: 100%;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
}

/* PAGE FRAME */

#pageFrame {
  width: 100%;
  flex: 1;
  min-height: 0;
  border: 0;
  background: var(--bg);
}

/* MINI PLAYER */

#miniPlayer {
  position: relative;
  width: 100%;
  min-height: 78px;
  padding: 11px 18px;
  padding-bottom: max(11px, env(safe-area-inset-bottom));
  background: rgba(17,14,27,.98);
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 15px;
  z-index: 20;
}

/* ARTWORK */

#miniArtwork {
  width: 49px;
  height: 49px;
  border-radius: 9px;
  object-fit: cover;
  background: #292334;
  flex-shrink: 0;
}

/* TRACK INFORMATION */

#miniTrackInfo {
  flex: 1;
  min-width: 0;
}

#miniTrackTitle {
  display: block;
  font-size: 13px;
  font-weight: 700;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

#miniArtist {
  display: block;
  font-size: 11px;
  color: var(--muted);
  margin-top: 5px;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

/* CONTROLS */

#miniControls {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}

.playerButton {
  width: 36px;
  height: 36px;
  border: 0;
  border-radius: 50%;
  background: transparent;
  color: var(--text);
  cursor: pointer;
  font-size: 17px;
  display: grid;
  place-items: center;
}

.playerButton:active {
  transform: scale(.92);
}

#shellPlayButton {
  width: 43px;
  height: 43px;
  color: #090811;
  background: linear-gradient(135deg,var(--purple),var(--teal));
  font-size: 18px;
  font-weight: bold;
}

/* EXTRA PLAYER CONTROLS */

#miniExtraControls {
  display: flex;
  align-items: center;
  gap: 5px;
}

#shellShuffleButton,
#shellRepeatButton {
  color: var(--muted);
  font-size: 13px;
}

#shellShuffleButton.active,
#shellRepeatButton.active {
  color: var(--teal);
}

/* PROGRESS */

#miniProgress {
  position: absolute;
  top: -2px;
  left: 0;
  width: 100%;
  height: 3px;
  margin: 0;
  appearance: none;
  -webkit-appearance: none;
  background: rgba(255,255,255,.12);
  cursor: pointer;
}

#miniProgress::-webkit-slider-thumb {
  appearance: none;
  -webkit-appearance: none;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--teal);
}

#miniProgress::-moz-range-thumb {
  width: 8px;
  height: 8px;
  border: 0;
  border-radius: 50%;
  background: var(--teal);
}

/* AUDIO */

#resonaAudio {
  display: none;
}

/* LOADING SCREEN */

#loadingScreen {
  position: absolute;
  inset: 0;
  z-index: 100;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 13px;
  transition: opacity .3s;
  pointer-events: none;
}

#loadingScreen.hidden {
  opacity: 0;
  visibility: hidden;
}

.logo {
  font-size: 36px;
  font-weight: 900;
  letter-spacing: 5px;
  background: linear-gradient(120deg,var(--purple),var(--teal));
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
}

#loadingScreen p {
  color: var(--muted);
  font-size: 12px;
}

.loader {
  width: 27px;
  height: 27px;
  border: 3px solid rgba(255,255,255,.1);
  border-top-color: var(--teal);
  border-radius: 50%;
  animation: rotate .8s linear infinite;
}

@keyframes rotate {
  to {
    transform: rotate(360deg);
  }
}

/* PLAYER MESSAGE */

#playerMessage {
  position: absolute;
  bottom: 92px;
  left: 50%;
  transform: translateX(-50%);
  background: #292139;
  color: white;
  border: 1px solid var(--border);
  border-radius: 25px;
  padding: 10px 16px;
  font-size: 12px;
  max-width: 90%;
  text-align: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s;
  z-index: 40;
}

#playerMessage.show {
  opacity: 1;
}

/* MOBILE */

@media(max-width:600px) {
  #miniPlayer {
    gap: 9px;
    padding-left: 11px;
    padding-right: 11px;
  }

  #miniArtwork {
    width: 43px;
    height: 43px;
  }

  #miniTrackTitle {
    font-size: 12px;
  }

  #miniControls {
    gap: 3px;
  }

  .playerButton {
    width: 32px;
    height: 32px;
  }

  #shellPlayButton {
    width: 39px;
    height: 39px;
  }

  #miniExtraControls {
    display: none;
  }
}

@media(max-width:360px) {
  #miniPlayer {
    gap: 7px;
    padding-left: 8px;
    padding-right: 8px;
  }

  #miniArtwork {
    width: 39px;
    height: 39px;
  }

  #miniArtist {
    font-size: 10px;
  }
}
</style>
</head>

<body>

<div id="resonaApp">

  <!-- PAGE DISPLAY -->

  <iframe
    id="pageFrame"
    title="Resona pages"
    src="index.html"
    allow="autoplay; encrypted-media"
  ></iframe>

  <!-- PERSISTENT PLAYER -->

  <div id="miniPlayer">

    <input
      type="range"
      id="miniProgress"
      min="0"
      max="1000"
      value="0"
      aria-label="Playback progress"
    >

    <img
      id="miniArtwork"
      alt="Album artwork"
    >

    <div id="miniTrackInfo">

      <span id="miniTrackTitle">
        Nothing playing
      </span>

      <span id="miniArtist">
        Discover music on Resona
      </span>

    </div>

    <div id="miniExtraControls">

      <button
        class="playerButton"
        id="shellShuffleButton"
        aria-label="Shuffle"
        title="Shuffle"
      >⤨</button>

      <button
        class="playerButton"
        id="shellRepeatButton"
        aria-label="Repeat off"
        title="Repeat off"
      >↻</button>

    </div>

    <div id="miniControls">

      <button
        class="playerButton"
        id="shellPreviousButton"
        aria-label="Previous track"
      >⏮</button>

      <button
        class="playerButton"
        id="shellPlayButton"
        aria-label="Play"
      >▶</button>

      <button
        class="playerButton"
        id="shellNextButton"
        aria-label="Next track"
      >⏭</button>

    </div>

  </div>

  <div id="playerMessage" role="status"></div>

  <div id="loadingScreen">

    <div class="logo">RESONA</div>

    <div class="loader"></div>

    <p>Preparing your music experience...</p>

  </div>

</div>

<!-- THE SINGLE PERSISTENT AUDIO ELEMENT -->

<audio
  id="resonaAudio"
  preload="metadata"
></audio>


<script>
(() => {

"use strict";

/* =====================================================
   RESONA SHARED APPLICATION ENGINE
   Version: 2.0.0
===================================================== */

const VERSION = "2.0.0";

const audio = document.getElementById("resonaAudio");
const frame = document.getElementById("pageFrame");

const SHELL_SOURCE = "resona-shell";
const PAGE_SOURCE = "resona-page";

const state = {
  currentTrack: null,
  queue: [],
  currentIndex: -1,
  shuffle: false,
  repeat: "off",
  isPlaying: false,
  volume: 1,
  muted: false,
  currentTime: 0,
  duration: 0,
  ready: false
};

const FALLBACK_ART =
  "data:image/svg+xml;charset=UTF-8," +
  encodeURIComponent(`
    <svg xmlns="http://www.w3.org/2000/svg"
         width="300" height="300">
      <rect width="100%" height="100%" fill="#211a35"/>
      <text x="50%" y="55%" fill="#a78bfa"
        font-size="90" text-anchor="middle"
        font-family="Arial">R</text>
    </svg>
  `);

const ALLOWED_PAGES = [
  "index.html",
  "explore.html",
  "search.html",
  "artist.html",
  "album.html",
  "player.html",
  "lyrics.html",
  "library.html",
  "playlists.html",
  "downloads.html",
  "profile.html",
  "settings.html",
  "login.html",
  "register.html",
  "forgot-password.html",
  "artist-dashboard.html",
  "upload.html"
];

/* =====================================================
   ELEMENTS
===================================================== */

const elements = {
  artwork: document.getElementById("miniArtwork"),
  title: document.getElementById("miniTrackTitle"),
  artist: document.getElementById("miniArtist"),
  play: document.getElementById("shellPlayButton"),
  previous: document.getElementById("shellPreviousButton"),
  next: document.getElementById("shellNextButton"),
  progress: document.getElementById("miniProgress"),
  message: document.getElementById("playerMessage"),
  loading: document.getElementById("loadingScreen"),
  shuffle: document.getElementById("shellShuffleButton"),
  repeat: document.getElementById("shellRepeatButton")
};

/* =====================================================
   UTILITIES
===================================================== */

function notify(message) {

  elements.message.textContent = message;

  elements.message.classList.add("show");

  clearTimeout(notify.timer);

  notify.timer = setTimeout(() => {
    elements.message.classList.remove("show");
  }, 2800);

}

function getTrackId(track) {

  return String(
    track?.id ||
    track?.track_id ||
    ""
  ).trim();

}

function getTrackTitle(track) {

  return (
    track?.title ||
    track?.name ||
    "Untitled track"
  );

}

function getArtistName(track) {

  return (
    track?.artist_name ||
    track?.artist ||
    "Unknown artist"
  );

}

function getArtwork(track) {

  const url =
    track?.artwork_url ||
    track?.album_artwork_url ||
    track?.cover_url ||
    track?.image_url ||
    "";

  if (!url) return FALLBACK_ART;

  try {

    const parsed = new URL(url, location.href);

    if (
      parsed.protocol !== "https:" &&
      parsed.origin !== location.origin
    ) {
      return FALLBACK_ART;
    }

    return parsed.href;

  } catch {
    return FALLBACK_ART;
  }

}

function getAudioUrl(track) {

  return (
    track?.audio_url ||
    track?.stream_url ||
    track?.file_url ||
    track?.audioUrl ||
    ""
  );

}

function validateTrack(track) {

  if (!track || typeof track !== "object") {
    throw new Error("Invalid track information.");
  }

  if (!getTrackId(track)) {
    throw new Error("Track ID is missing.");
  }

  if (!getAudioUrl(track)) {
    throw new Error("This track has no available audio file.");
  }

  return track;

}

/* =====================================================
   PLAYER DISPLAY
===================================================== */

function updateDisplay(track) {

  state.currentTrack = track || null;

  if (!track) {

    elements.title.textContent = "Nothing playing";
    elements.artist.textContent = "Discover music on Resona";
    elements.artwork.src = FALLBACK_ART;

    return;

  }

  elements.title.textContent = getTrackTitle(track);

  elements.artist.textContent = getArtistName(track);

  elements.artwork.src = getArtwork(track);

  elements.artwork.onerror = () => {
    elements.artwork.src = FALLBACK_ART;
  };

  updateMediaSession();

}

/* =====================================================
   PLAYER STATE
===================================================== */

function getState() {

  state.isPlaying = !audio.paused;
  state.currentTime = audio.currentTime || 0;
  state.duration = Number.isFinite(audio.duration)
    ? audio.duration
    : 0;

  state.volume = audio.volume;
  state.muted = audio.muted;

  return {
    ready: state.ready,
    currentTrack: state.currentTrack,
    queue: state.queue,
    currentIndex: state.currentIndex,
    shuffle: state.shuffle,
    repeat: state.repeat,
    isPlaying: state.isPlaying,
    currentTime: state.currentTime,
    duration: state.duration,
    volume: state.volume,
    muted: state.muted
  };

}

/* =====================================================
   MESSAGE COMMUNICATION
===================================================== */

function sendToPage(action, payload, requestId) {

  if (!frame.contentWindow) return;

  try {

    frame.contentWindow.postMessage({

      source: SHELL_SOURCE,
      version: VERSION,
      action: action,
      requestId: requestId || null,
      payload: payload || {}

    }, location.origin);

  } catch (error) {

    console.error(
      "[Resona Shell] Message error:",
      error
    );

  }

}

function broadcast(action, payload) {

  sendToPage(action, payload);

}

function sendPlayerState() {

  broadcast("PLAYER_STATE", getState());

}

function respond(event, message, payload) {

  if (!message.requestId) return;

  event.source.postMessage({

    source: SHELL_SOURCE,
    version: VERSION,
    action: message.action,
    requestId: message.requestId,
    payload: payload || {
      success: true
    }

  }, event.origin);

}

/* =====================================================
   TRACK PLAYBACK
===================================================== */

async function playTrack(track, index) {

  try {

    validateTrack(track);

  } catch (error) {

    notify(error.message);

    return {
      success: false,
      error: error.message
    };

  }

  const audioUrl = getAudioUrl(track);

  let parsed;

  try {

    parsed = new URL(audioUrl, location.href);

    if (
      parsed.protocol !== "https:" &&
      parsed.origin !== location.origin
    ) {
      throw new Error("Unsupported audio address.");
    }

  } catch {

    notify("Invalid audio file address.");

    return {
      success: false,
      error: "Invalid audio file address."
    };

  }

  if (Number.isInteger(index)) {
    state.currentIndex = index;
  }

  updateDisplay(track);

  audio.pause();

  audio.src = parsed.href;

  audio.load();

  try {

    await audio.play();

    state.isPlaying = true;

    updateControls();

    updateMediaSession();

    sendPlayerState();

    broadcast("TRACK_CHANGED", {
      track: track
    });

    return {
      success: true
    };

  } catch (error) {

    state.isPlaying = false;

    updateControls();

    if (error.name === "NotAllowedError") {

      notify("Tap play to start listening.");

    } else {

      notify("Unable to play this track.");

    }

    return {
      success: false,
      error: error.message
    };

  }

}

/* =====================================================
   PLAY TRACK WITH QUEUE
===================================================== */

async function playTrackWithQueue(track, queue) {

  if (!Array.isArray(queue)) {
    queue = [];
  }

  const trackId = getTrackId(track);

  state.queue = queue.filter(item => {
    return getTrackId(item);
  });

  let index = state.queue.findIndex(item => {
    return getTrackId(item) === trackId;
  });

  if (index < 0) {

    state.queue.unshift(track);

    index = 0;

  }

  return playTrack(state.queue[index], index);

}

/* =====================================================
   QUEUE MANAGEMENT
===================================================== */

async function setQueue(tracks, startTrackId) {

  if (!Array.isArray(tracks) || !tracks.length) {

    return {
      success: false,
      error: "No tracks were provided."
    };

  }

  state.queue = tracks.filter(track => {
    return getTrackId(track);
  });

  if (!state.queue.length) {

    return {
      success: false,
      error: "Queue contains no valid tracks."
    };

  }

  let index = state.queue.findIndex(track => {

    return getTrackId(track) === String(startTrackId);

  });

  if (index < 0) index = 0;

  return playTrack(state.queue[index], index);

}

function addToQueue(track) {

  try {

    validateTrack(track);

  } catch (error) {

    return {
      success: false,
      error: error.message
    };

  }

  const existing = state.queue.some(item => {

    return getTrackId(item) === getTrackId(track);

  });

  if (existing) {

    notify("This track is already in the queue.");

    return {
      success: true,
      alreadyExists: true
    };

  }

  state.queue.push(track);

  notify("Added to queue.");

  sendPlayerState();

  return {
    success: true
  };

}

/* =====================================================
   NEXT TRACK
===================================================== */

async function nextTrack() {

  if (!state.queue.length) {

    notify("Your queue is empty.");

    return;

  }

  let index;

  if (state.shuffle && state.queue.length > 1) {

    const choices = state.queue
      .map((track, i) => i)
      .filter(i => i !== state.currentIndex);

    index = choices[
      Math.floor(Math.random() * choices.length)
    ];

  } else {

    index = state.currentIndex + 1;

    if (index >= state.queue.length) {

      if (state.repeat === "all") {

        index = 0;

      } else {

        audio.pause();

        notify("End of queue.");

        return;

      }

    }

  }

  return playTrack(state.queue[index], index);

}

/* =====================================================
   PREVIOUS TRACK
===================================================== */

async function previousTrack() {

  if (!state.queue.length) return;

  if (audio.currentTime > 3) {

    audio.currentTime = 0;

    return;

  }

  let index = state.currentIndex - 1;

  if (index < 0) {

    if (state.repeat === "all") {

      index = state.queue.length - 1;

    } else {

      audio.currentTime = 0;

      return;

    }

  }

  return playTrack(state.queue[index], index);

}

/* =====================================================
   REPEAT
===================================================== */

function cycleRepeat() {

  if (state.repeat === "off") {
    state.repeat = "all";
  } else if (state.repeat === "all") {
    state.repeat = "one";
  } else {
    state.repeat = "off";
  }

  updateControls();

  sendPlayerState();

}

function setRepeat(mode) {

  if (!["off", "all", "one"].includes(mode)) {

    return {
      success: false,
      error: "Invalid repeat mode."
    };

  }

  state.repeat = mode;

  updateControls();

  sendPlayerState();

  return {
    success: true,
    repeat: mode
  };

}

/* =====================================================
   SHUFFLE
===================================================== */

function setShuffle(enabled) {

  state.shuffle = Boolean(enabled);

  updateControls();

  sendPlayerState();

  return {
    success: true,
    shuffle: state.shuffle
  };

}

/* =====================================================
   PLAYBACK CONTROLS
===================================================== */

async function togglePlayback() {

  if (!audio.src) {

    if (
      state.currentIndex >= 0 &&
      state.queue[state.currentIndex]
    ) {

      return playTrack(
        state.queue[state.currentIndex],
        state.currentIndex
      );

    }

    notify("Choose a song first.");

    return {
      success: false,
      error: "No track selected."
    };

  }

  if (audio.paused) {

    try {

      await audio.play();

      return {
        success: true
      };

    } catch (error) {

      notify("Unable to start playback.");

      return {
        success: false,
        error: error.message
      };

    }

  }

  audio.pause();

  return {
    success: true
  };

}

function seek(seconds) {

  const value = Number(seconds);

  if (
    !Number.isFinite(value) ||
    value < 0 ||
    !Number.isFinite(audio.duration)
  ) {

    return {
      success: false,
      error: "Invalid playback position."
    };

  }

  audio.currentTime = Math.min(
    value,
    audio.duration
  );

  return {
    success: true
  };

}

function setVolume(value) {

  const volume = Number(value);

  if (!Number.isFinite(volume)) {

    return {
      success: false,
      error: "Invalid volume."
    };

  }

  audio.volume = Math.max(0, Math.min(1, volume));

  if (audio.volume > 0) {
    audio.muted = false;
  }

  updateControls();

  return {
    success: true,
    volume: audio.volume
  };

}

function mute() {

  audio.muted = true;

  updateControls();

  return {
    success: true
  };

}

function unmute() {

  audio.muted = false;

  updateControls();

  return {
    success: true
  };

}

/* =====================================================
   NAVIGATION
===================================================== */

function navigate(url) {

  const raw = String(url || "").trim();

  if (!raw) {

    return {
      success: false,
      error: "Missing page address."
    };

  }

  let destination;

  try {

    destination = new URL(raw, location.href);

  } catch {

    return {
      success: false,
      error: "Invalid page address."
    };

  }

  if (destination.origin !== location.origin) {

    return {
      success: false,
      error: "External navigation is not allowed."
    };

  }

  const filename = destination.pathname
    .split("/")
    .pop();

  if (!ALLOWED_PAGES.includes(filename)) {

    return {
      success: false,
      error: "This Resona page is not available."
    };

  }

  const target =
    filename +
    destination.search +
    destination.hash;

  const current = frame.getAttribute("src");

  if (current === target) {

    return {
      success: true,
      unchanged: true
    };

  }

  frame.src = target;

  return {
    success: true,
    url: target
  };

}

/* =====================================================
   PLAYER DISPLAY CONTROLS
===================================================== */

function updateControls() {

  elements.play.textContent =
    audio.paused ? "▶" : "Ⅱ";

  elements.play.setAttribute(
    "aria-label",
    audio.paused ? "Play" : "Pause"
  );

  elements.shuffle.classList.toggle(
    "active",
    state.shuffle
  );

  elements.repeat.classList.toggle(
    "active",
    state.repeat !== "off"
  );

  elements.repeat.textContent =
    state.repeat === "one" ? "↻¹" : "↻";

  elements.repeat.title =
    "Repeat " + state.repeat;

  elements.shuffle.title =
    state.shuffle ? "Shuffle on" : "Shuffle off";

}

/* =====================================================
   AUDIO EVENTS
===================================================== */

audio.addEventListener("play", () => {

  state.isPlaying = true;

  updateControls();

  broadcast("PLAYBACK_PLAY", getState());

  sendPlayerState();

  updateMediaSession();

});

audio.addEventListener("pause", () => {

  state.isPlaying = false;

  updateControls();

  broadcast("PLAYBACK_PAUSE", getState());

  sendPlayerState();

  updateMediaSession();

});

audio.addEventListener("ended", async () => {

  if (state.repeat === "one") {

    audio.currentTime = 0;

    try {
      await audio.play();
    } catch {}

    return;

  }

  broadcast("PLAYBACK_ENDED", getState());

  if (state.currentIndex < state.queue.length - 1) {

    await nextTrack();

  } else if (state.repeat === "all") {

    await nextTrack();

  } else {

    state.isPlaying = false;

    updateControls();

  }

});

audio.addEventListener("timeupdate", () => {

  if (
    !Number.isFinite(audio.duration) ||
    audio.duration <= 0
  ) return;

  state.currentTime = audio.currentTime;

  state.duration = audio.duration;

  elements.progress.value = Math.round(
    audio.currentTime / audio.duration * 1000
  );

  broadcast("TIME_UPDATE", {
    currentTime: audio.currentTime,
    duration: audio.duration
  });

});

audio.addEventListener("loadedmetadata", () => {

  state.duration = audio.duration || 0;

  sendPlayerState();

});

audio.addEventListener("error", () => {

  if (audio.src) {
    notify("Audio could not be loaded.");
  }

  broadcast("PLAYER_ERROR", {
    message: "Audio could not be loaded."
  });

});

/* =====================================================
   PROGRESS CONTROL
===================================================== */

elements.progress.addEventListener("input", event => {

  if (!Number.isFinite(audio.duration)) return;

  audio.currentTime =
    audio.duration *
    Number(event.target.value) / 1000;

});

/* =====================================================
   BUTTON EVENTS
===================================================== */

elements.play.addEventListener(
  "click",
  togglePlayback
);

elements.next.addEventListener(
  "click",
  nextTrack
);

elements.previous.addEventListener(
  "click",
  previousTrack
);

elements.shuffle.addEventListener("click", () => {

  setShuffle(!state.shuffle);

});

elements.repeat.addEventListener(
  "click",
  cycleRepeat
);

/* =====================================================
   MEDIA SESSION
===================================================== */

function updateMediaSession() {

  if (!("mediaSession" in navigator)) return;

  const track = state.currentTrack;

  if (!track) return;

  try {

    navigator.mediaSession.metadata =
      new MediaMetadata({

        title: getTrackTitle(track),

        artist: getArtistName(track),

        album: track.album_title || "Resona",

        artwork: [
          {
            src: getArtwork(track),
            sizes: "300x300",
            type: "image/jpeg"
          }
        ]

      });

  } catch (error) {

    console.warn(
      "[Resona] Media metadata unavailable:",
      error
    );

  }

}

if ("mediaSession" in navigator) {

  const actions = {

    play: () => audio.play().catch(() => {}),

    pause: () => audio.pause(),

    previoustrack: previousTrack,

    nexttrack: nextTrack,

    seekto: details => {

      if (
        Number.isFinite(details.seekTime) &&
        Number.isFinite(audio.duration)
      ) {
        audio.currentTime = details.seekTime;
      }

    }

  };

  Object.entries(actions).forEach(([action, handler]) => {

    try {

      navigator.mediaSession.setActionHandler(
        action,
        handler
      );

    } catch {}

  });

}

/* =====================================================
   MESSAGE HANDLER
===================================================== */

window.addEventListener("message", async event => {

  if (event.source !== frame.contentWindow) return;

  if (event.origin !== location.origin) return;

  const message = event.data;

  if (!message || typeof message !== "object") return;

  if (message.source !== PAGE_SOURCE) return;

  if (message.version !== "1.0.0") {

    console.warn(
      "[Resona] Bridge version mismatch:",
      message.version
    );

  }

  const payload = message.payload || {};

  let result = {
    success: true
  };

  try {

    switch (message.action) {

      case "PAGE_READY":

        result = {
          success: true,
          page: payload.page
        };

        break;

      case "PLAY_TRACK":

        result = await playTrackWithQueue(
          payload.track,
          payload.queue || []
        );

        break;

      case "SET_QUEUE":

        result = await setQueue(
          payload.tracks,
          payload.startTrackId
        );

        break;

      case "ADD_TO_QUEUE":

        result = addToQueue(payload.track);

        break;

      case "NAVIGATE":

        result = navigate(payload.url);

        break;

      case "PAUSE":

        audio.pause();

        result = {
          success: true
        };

        break;

      case "RESUME":

        try {

          await audio.play();

          result = {
            success: true
          };

        } catch (error) {

          result = {
            success: false,
            error: error.message
          };

        }

        break;

      case "TOGGLE_PLAY":

        result = await togglePlayback();

        break;

      case "NEXT_TRACK":

        await nextTrack();

        result = {
          success: true
        };

        break;

      case "PREVIOUS_TRACK":

        await previousTrack();

        result = {
          success: true
        };

        break;

      case "SEEK":

        result = seek(payload.seconds);

        break;

      case "SET_VOLUME":

        result = setVolume(payload.volume);

        break;

      case "MUTE":

        result = mute();

        break;

      case "UNMUTE":

        result = unmute();

        break;

      case "SET_SHUFFLE":

        result = setShuffle(payload.enabled);

        break;

      case "SET_REPEAT":

        result = setRepeat(payload.mode);

        break;

      case "GET_PLAYER_STATE":

        result = {
          success: true,
          state: getState()
        };

        break;

      default:

        result = {
          success: false,
          error: "Unknown player command."
        };

    }

  } catch (error) {

    console.error(
      "[Resona Shell] Command error:",
      error
    );

    result = {
      success: false,
      error: error.message
    };

  }

  respond(event, message, result);

});

/* =====================================================
   PAGE LOAD
===================================================== */

frame.addEventListener("load", () => {

  elements.loading.classList.add("hidden");

  state.ready = true;

  setTimeout(() => {

    sendToPage("SHELL_READY", getState());

    sendPlayerState();

  }, 150);

});

/* =====================================================
   INITIALIZATION
===================================================== */

elements.artwork.src = FALLBACK_ART;

audio.volume = 1;

updateControls();

state.ready = true;

/* =====================================================
   PUBLIC PLAYER API
===================================================== */

window.ResonaPlayer = Object.freeze({

  version: VERSION,

  play: playTrack,

  playWithQueue: playTrackWithQueue,

  pause: () => audio.pause(),

  resume: () => audio.play(),

  toggle: togglePlayback,

  next: nextTrack,

  previous: previousTrack,

  seek: seek,

  setVolume: setVolume,

  mute: mute,

  unmute: unmute,

  setShuffle: setShuffle,

  setRepeat: setRepeat,

  setQueue: setQueue,

  addToQueue: addToQueue,

  navigate: navigate,

  getState: getState

});

console.info(
  "[Resona Shell] Engine v" + VERSION + " initialized."
);

})();
</script>
