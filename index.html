<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Resona</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64' fill='none'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%23c4b5fd'/%3E%3Cstop offset='50%25' stop-color='%23a78bfa'/%3E%3Cstop offset='100%25' stop-color='%232dd4bf'/%3E%3C/linearGradient%3E%3ClinearGradient id='g2' x1='0.2' y1='0' x2='0.8' y2='1'%3E%3Cstop offset='0%25' stop-color='%23ddd6fe'/%3E%3Cstop offset='100%25' stop-color='%235eead4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='%2307070b'/%3E%3Ccircle cx='32' cy='32' r='22' stroke='url(%23g)' stroke-width='2.5' opacity='0.35'/%3E%3Ccircle cx='32' cy='32' r='15.5' stroke='url(%23g)' stroke-width='3' opacity='0.7'/%3E%3Ccircle cx='32' cy='32' r='7' fill='url(%23g2)'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #07070b;
      --s: rgba(255,255,255,.06);
      --b: rgba(255,255,255,.1);
      --tx: #f3f1fa;
      --mu: #9b97b0;
      --pu: #a78bfa;
      --te: #2dd4bf;
      color-scheme: dark;
    }
    * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; background: var(--bg); color: var(--tx); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
    body {
      background:
        radial-gradient(600px 400px at 10% -5%, rgba(167,139,250,.22), transparent),
        radial-gradient(500px 400px at 100% 10%, rgba(45,212,191,.14), transparent),
        var(--bg);
      background-attachment: fixed;
    }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    #app { max-width: 760px; margin: 0 auto; height: 100%; position: relative; }
    #main { height: 100%; overflow-y: auto; padding: 18px 16px 200px; scroll-behavior: smooth; }
    h1 { font-size: 26px; letter-spacing: -.5px; }
    h2 { font-size: 18px; margin: 22px 0 10px; }
    .tag { color: var(--mu); font-size: 13px; }
    .glass {
      background: var(--s);
      border: 1px solid var(--b);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 18px;
    }
    .art {
      border-radius: 10px;
      flex: none;
      display: grid;
      place-items: center;
      font-weight: 700;
      color: rgba(255,255,255,.85);
      background: linear-gradient(135deg, #312e81, #134e4a);
    }
    .row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px;
      border-radius: 12px;
      width: 100%;
      text-align: left;
      transition: background .2s;
    }
    .row:hover, .row.on { background: var(--s); }
    .row.on .tt { color: var(--te); }
    .row .m { flex: 1; min-width: 0; }
    .tt { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hs { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; }
    .hs::-webkit-scrollbar { display: none; }
    .card { flex: none; width: 136px; text-align: left; }
    .card .art { width: 136px; height: 136px; margin-bottom: 6px; border-radius: 14px; font-size: 28px; }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; }
    .chip {
      padding: 7px 14px;
      border-radius: 99px;
      background: var(--s);
      border: 1px solid var(--b);
      font-size: 13px;
      transition: .2s;
    }
    .chip.on {
      background: linear-gradient(135deg, var(--pu), var(--te));
      color: #07070b;
      border-color: transparent;
      font-weight: 600;
    }
    .cta {
      background: linear-gradient(135deg, var(--pu), var(--te));
      color: #07070b;
      font-weight: 700;
      padding: 12px 20px;
      border-radius: 99px;
    }
    .hero {
      padding: 18px;
      margin: 14px 0;
      display: flex;
      gap: 14px;
      align-items: center;
      justify-content: space-between;
    }
    input.q {
      width: 100%;
      padding: 13px 16px;
      border-radius: 99px;
      background: var(--s);
      border: 1px solid var(--b);
      color: var(--tx);
      font: inherit;
      outline: 0;
    }
    input.q:focus { border-color: var(--pu); }
    #mini {
      position: fixed;
      left: 8px; right: 8px;
      bottom: calc(64px + env(safe-area-inset-bottom, 0px));
      max-width: 744px;
      margin: 0 auto;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 5;
      cursor: pointer;
    }
    #mini .bar {
      position: absolute;
      left: 14px; right: 14px; bottom: 0;
      height: 2px;
      background: rgba(255,255,255,.1);
    }
    #mini .bar i {
      display: block;
      height: 100%;
      background: var(--te);
      width: 0%;
      transition: width .3s linear;
    }
    nav {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      display: flex;
      justify-content: center;
      background: rgba(7,7,11,.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--b);
      padding: 6px 0 calc(6px + env(safe-area-inset-bottom, 0px));
      z-index: 6;
    }
    nav button {
      flex: 1;
      max-width: 150px;
      color: var(--mu);
      font-size: 11px;
      display: grid;
      gap: 2px;
      justify-items: center;
      padding: 4px;
    }
    nav button.on { color: var(--tx); }
    nav span { font-size: 20px; }
    .ic {
      font-size: 22px;
      width: 40px; height: 40px;
      border-radius: 50%;
      display: grid;
      place-items: center;
    }
    .ic.big {
      background: var(--tx);
      color: #07070b;
      width: 54px; height: 54px;
      font-size: 22px;
    }
    .ic.on { color: var(--te); }

    /* Now Playing */
    #np {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      padding: calc(14px + env(safe-area-inset-top, 0px)) 20px calc(18px + env(safe-area-inset-bottom, 0px));
      transform: translateY(100%);
      transition: transform .5s cubic-bezier(.2,.8,.2,1);
      overflow: hidden;
      background: var(--bg);
    }
    #np.open { transform: none; }
    #npbg {
      position: absolute;
      inset: -20%;
      z-index: -1;
      filter: blur(70px);
      opacity: .55;
      transition: background 1s;
    }
    #np > * { max-width: 640px; width: 100%; margin-inline: auto; }
    .lyrics {
      flex: 1;
      overflow-y: auto;
      text-align: center;
      padding: 20px 10px 40px;
      font-size: 22px;
      line-height: 1.7;
      color: var(--mu);
    }
    .lyrics .line { transition: all .3s; padding: 4px 0; }
    .lyrics .line.active {
      color: var(--tx);
      font-weight: 600;
      transform: scale(1.05);
    }
    .page { display: none; }
    .page.active { display: block; }
    .mood-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 16px;
    }
    .mood {
      padding: 20px 12px;
      border-radius: 16px;
      background: var(--s);
      border: 1px solid var(--b);
      text-align: center;
      font-weight: 600;
      transition: .2s;
    }
    .mood:hover, .mood.on {
      background: linear-gradient(135deg, rgba(167,139,250,.25), rgba(45,212,191,.2));
      border-color: var(--pu);
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="main">
      <!-- HOME -->
      <div class="page active" id="page-home">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div>
            <div class="tag">Good evening</div>
            <h1>Resona</h1>
          </div>
          <button class="cta" onclick="openReset()" style="padding:8px 16px;font-size:13px">The Reset</button>
        </div>

        <div class="hero glass">
          <div>
            <div class="tag">Made for you</div>
            <div style="font-weight:700;font-size:17px;margin:4px 0">Your Daily Mix</div>
            <div class="tag">Based on what you love</div>
          </div>
          <button class="cta" onclick="playSong(0)">Play</button>
        </div>

        <h2>Recently played</h2>
        <div class="hs" id="recent"></div>

        <h2>Recommended</h2>
        <div id="recommended"></div>
      </div>

      <!-- SEARCH -->
      <div class="page" id="page-search">
        <h1>Search</h1>
        <input class="q" id="searchInput" placeholder="Songs, artists, albums..." oninput="doSearch(this.value)">
        <div id="searchResults" style="margin-top:16px"></div>
      </div>

      <!-- LIBRARY -->
      <div class="page" id="page-library">
        <h1>Your Library</h1>
        <div class="chips" style="margin:12px 0 18px">
          <button class="chip on">Playlists</button>
          <button class="chip">Artists</button>
          <button class="chip">Albums</button>
        </div>
        <div id="libraryList"></div>
      </div>

      <!-- RESET -->
      <div class="page" id="page-reset">
        <h1>The Reset</h1>
        <p class="tag" style="margin:8px 0 4px">Feeling stuck with the same recommendations?</p>
        <p style="margin-bottom:8px">Choose a new mood and start fresh.</p>

        <div class="mood-grid" id="moods">
          <button class="mood" data-mood="calm">Calm</button>
          <button class="mood" data-mood="energetic">Energetic</button>
          <button class="mood" data-mood="melancholy">Melancholy</button>
          <button class="mood" data-mood="focus">Focus</button>
          <button class="mood" data-mood="party">Party</button>
          <button class="mood" data-mood="night">Late Night</button>
        </div>

        <button class="cta" style="width:100%;margin-top:24px" onclick="doReset()">Generate New Sound</button>
        <p class="tag" style="text-align:center;margin-top:12px" id="resetMsg"></p>
      </div>
    </div>

    <!-- MINI PLAYER -->
    <div id="mini" class="glass" onclick="openNowPlaying()" style="display:none">
      <div class="art" id="miniArt" style="width:44px;height:44px;font-size:16px">♪</div>
      <div class="m">
        <div class="tt" id="miniTitle">Song</div>
        <div class="tag" id="miniArtist">Artist</div>
      </div>
      <button class="ic" id="miniPlay" onclick="event.stopPropagation();togglePlay()">▶</button>
      <div class="bar"><i id="miniProgress"></i></div>
    </div>

    <!-- BOTTOM NAV -->
    <nav>
      <button class="on" onclick="showPage('home', this)"><span>⌂</span>Home</button>
      <button onclick="showPage('search', this)"><span>⌕</span>Search</button>
      <button onclick="showPage('library', this)"><span>☰</span>Library</button>
      <button onclick="showPage('reset', this)"><span>↻</span>Reset</button>
    </nav>

    <!-- NOW PLAYING -->
    <div id="np">
      <div id="npbg"></div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <button onclick="closeNowPlaying()" style="font-size:20px">↓</button>
        <div class="tag">Now Playing</div>
        <button style="opacity:0">···</button>
      </div>

      <div class="art" id="npArt" style="width:min(70vw,280px);height:min(70vw,280px);margin:10px auto 20px;border-radius:18px;font-size:48px">♪</div>

      <div style="text-align:center;margin-bottom:8px">
        <div style="font-size:22px;font-weight:700" id="npTitle">Song</div>
        <div class="tag" id="npArtist">Artist</div>
      </div>

      <div class="lyrics" id="lyrics"></div>

      <div style="margin-top:auto;padding-top:12px">
        <div style="height:4px;background:rgba(255,255,255,.15);border-radius:99px;margin-bottom:16px">
          <div id="npProgress" style="height:100%;width:0%;background:var(--te);border-radius:99px;transition:width .3s linear"></div>
        </div>
        <div style="display:flex;justify-content:center;align-items:center;gap:28px">
          <button class="ic" onclick="prevSong()">⏮</button>
          <button class="ic big" id="npPlay" onclick="togglePlay()">▶</button>
          <button class="ic" onclick="nextSong()">⏭</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ========== MOCK DATA ==========
    const songs = [
      {
        id: 0, title: "Midnight Drive", artist: "Luna Echo", color: "linear-gradient(135deg,#4c1d95,#0f766e)",
        lyrics: [
          { t: 0, text: "City lights are calling me again" },
          { t: 5, text: "Windows down, the night begins" },
          { t: 10, text: "Every street feels brand new" },
          { t: 15, text: "When I'm lost in thoughts of you" },
          { t: 20, text: "We're just floating through the dark" },
          { t: 25, text: "Heartbeats matching every spark" },
          { t: 30, text: "This is where I want to stay" },
          { t: 35, text: "Until the night turns into day" }
        ]
      },
      {
        id: 1, title: "Soft Static", artist: "Velvet Static", color: "linear-gradient(135deg,#831843,#1e3a8a)",
        lyrics: [
          { t: 0, text: "There's a quiet in the noise" },
          { t: 5, text: "A frequency only we can hear" },
          { t: 10, text: "Between the stations of our lives" },
          { t: 15, text: "I found your signal crystal clear" },
          { t: 20, text: "Soft static, hold me close" },
          { t: 25, text: "In the space between the notes" }
        ]
      },
      {
        id: 2, title: "Ocean Circuit", artist: "Tideform", color: "linear-gradient(135deg,#164e63,#4c1d95)",
        lyrics: [
          { t: 0, text: "Waves of light across the glass" },
          { t: 5, text: "Digital tides that never last" },
          { t: 10, text: "We dive deeper than before" },
          { t: 15, text: "Looking for something more" }
        ]
      },
      {
        id: 3, title: "Afterglow", artist: "Solenne", color: "linear-gradient(135deg,#9d174d,#6b21a8)",
        lyrics: [
          { t: 0, text: "The sun has left but gold remains" },
          { t: 5, text: "Painted on the window frames" },
          { t: 10, text: "I keep your warmth inside my chest" },
          { t: 15, text: "Even when the day has left" }
        ]
      },
      {
        id: 4, title: "Neon Rain", artist: "Pulse District", color: "linear-gradient(135deg,#1e3a8a,#0f766e)",
        lyrics: [
          { t: 0, text: "Reflections dance on wet concrete" },
          { t: 5, text: "Every drop a different beat" },
          { t: 10, text: "Under neon we forget the day" },
          { t: 15, text: "Let the city wash us away" }
        ]
      },
      {
        id: 5, title: "Quiet Hours", artist: "Mira Vale", color: "linear-gradient(135deg,#4a044e,#1e1b4b)",
        lyrics: [
          { t: 0, text: "When the world finally slows" },
          { t: 5, text: "And the only sound is us" },
          { t: 10, text: "In these quiet hours I know" },
          { t: 15, text: "This is more than enough" }
        ]
      }
    ];

    let currentIndex = 0;
    let isPlaying = false;
    let progress = 0;
    let progressTimer = null;
    let lyricIndex = 0;

    // ========== RENDER HELPERS ==========
    function songRow(s, i) {
      return `
        <button class="row \( {i === currentIndex && isPlaying ? 'on' : ''}" onclick="playSong( \){i})">
          <div class="art" style="width:48px;height:48px;background:${s.color}">♪</div>
          <div class="m">
            <div class="tt">${s.title}</div>
            <div class="tag">${s.artist}</div>
          </div>
        </button>`;
    }

    function renderHome() {
      document.getElementById('recent').innerHTML = songs.slice(0,4).map((s,i) => `
        <button class="card" onclick="playSong(${i})">
          <div class="art" style="background:${s.color}">♪</div>
          <div class="tt">${s.title}</div>
          <div class="tag">${s.artist}</div>
        </button>`).join('');

      document.getElementById('recommended').innerHTML = songs.map((s,i) => songRow(s,i)).join('');
    }

    function renderLibrary() {
      document.getElementById('libraryList').innerHTML = `
        <button class="row" onclick="playSong(0)">
          <div class="art" style="width:48px;height:48px;background:linear-gradient(135deg,var(--pu),var(--te))">♥</div>
          <div class="m"><div class="tt">Liked Songs</div><div class="tag">12 songs</div></div>
        </button>
        ${songs.map((s,i) => songRow(s,i)).join('')}`;
    }

    function renderSearch(q = '') {
      const filtered = songs.filter(s =>
        s.title.toLowerCase().includes(q.toLowerCase()) ||
        s.artist.toLowerCase().includes(q.toLowerCase())
      );
      document.getElementById('searchResults').innerHTML = filtered.length
        ? filtered.map(s => songRow(s, s.id)).join('')
        : `<p class="tag" style="padding:20px 0">No results for "${q}"</p>`;
    }

    // ========== PLAYER ==========
    function playSong(i) {
      currentIndex = i;
      const s = songs[i];
      isPlaying = true;
      progress = 0;
      lyricIndex = 0;

      // Update mini
      document.getElementById('mini').style.display = 'flex';
      document.getElementById('miniTitle').textContent = s.title;
      document.getElementById('miniArtist').textContent = s.artist;
      document.getElementById('miniArt').style.background = s.color;
      document.getElementById('miniPlay').textContent = '⏸';

      // Update Now Playing
      document.getElementById('npTitle').textContent = s.title;
      document.getElementById('npArtist').textContent = s.artist;
      document.getElementById('npArt').style.background = s.color;
      document.getElementById('npbg').style.background = s.color;
      document.getElementById('npPlay').textContent = '⏸';

      // Lyrics
      const lyricsEl = document.getElementById('lyrics');
      lyricsEl.innerHTML = s.lyrics.map((l, idx) =>
        `<div class="line" data-i="\( {idx}"> \){l.text}</div>`
      ).join('');

      startProgress();
      updateLyrics();
      renderHome();
      renderLibrary();
    }

    function togglePlay() {
      isPlaying = !isPlaying;
      document.getElementById('miniPlay').textContent = isPlaying ? '⏸' : '▶';
      document.getElementById('npPlay').textContent = isPlaying ? '⏸' : '▶';
      if (isPlaying) startProgress();
      else clearInterval(progressTimer);
    }

    function startProgress() {
      clearInterval(progressTimer);
      progressTimer = setInterval(() => {
        if (!isPlaying) return;
        progress += 0.8;
        if (progress >= 100) {
          nextSong();
          return;
        }
        document.getElementById('miniProgress').style.width = progress + '%';
        document.getElementById('npProgress').style.width = progress + '%';
        updateLyrics();
      }, 300);
    }

    function updateLyrics() {
      const s = songs[currentIndex];
      const currentTime = (progress / 100) * 40; // fake 40s song
      let newIndex = 0;
      for (let i = 0; i < s.lyrics.length; i++) {
        if (currentTime >= s.lyrics[i].t) newIndex = i;
      }
      if (newIndex !== lyricIndex) {
        lyricIndex = newIndex;
        document.querySelectorAll('.lyrics .line').forEach((el, i) => {
          el.classList.toggle('active', i === lyricIndex);
        });
        const active = document.querySelector('.lyrics .line.active');
        if (active) active.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }

    function nextSong() {
      playSong((currentIndex + 1) % songs.length);
    }
    function prevSong() {
      playSong((currentIndex - 1 + songs.length) % songs.length);
    }

    function openNowPlaying() {
      document.getElementById('np').classList.add('open');
    }
    function closeNowPlaying() {
      document.getElementById('np').classList.remove('open');
    }

    // ========== NAVIGATION ==========
    function showPage(name, btn) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById('page-' + name).classList.add('active');
      document.querySelectorAll('nav button').forEach(b => b.classList.remove('on'));
      if (btn) btn.classList.add('on');
    }

    function doSearch(q) {
      renderSearch(q);
    }

    // ========== THE RESET ==========
    let selectedMood = null;
    document.getElementById('moods').addEventListener('click', e => {
      if (e.target.classList.contains('mood')) {
        document.querySelectorAll('.mood').forEach(m => m.classList.remove('on'));
        e.target.classList.add('on');
        selectedMood = e.target.dataset.mood;
      }
    });

    function openReset() {
      showPage('reset', document.querySelector('nav button:last-child'));
    }

    function doReset() {
      if (!selectedMood) {
        document.getElementById('resetMsg').textContent = 'Please choose a mood first';
        return;
      }
      document.getElementById('resetMsg').textContent = `Generating fresh recommendations for “${selectedMood}”...`;
      setTimeout(() => {
        // Shuffle songs for demo
        songs.sort(() => Math.random() - 0.5);
        renderHome();
        document.getElementById('resetMsg').textContent = `Done! Your new ${selectedMood} sound is ready on Home.`;
        setTimeout(() => showPage('home', document.querySelector('nav button')), 1200);
      }, 900);
    }

    // ========== INIT ==========
    renderHome();
    renderLibrary();
    renderSearch();
  </script>
</body>
  </html>
